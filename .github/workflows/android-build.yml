name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/home-screen-app-widgets-compatibility ]
    paths:
      - 'TVLauncher-v1.9.1-ready.zip'
      - 'app/**'
      - 'patches/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          test -f TVLauncher-v1.9.1-ready.zip
          mkdir -p source
          unzip -q TVLauncher-v1.9.1-ready.zip -d source
          test -f source/TVRemoteLauncher-v1.9/settings.gradle
          MAIN_ACTIVITY="source/TVRemoteLauncher-v1.9/app/src/main/java/tw/kangyuan/tvlauncher/MainActivity.java"
          test -f "$MAIN_ACTIVITY"
          sed -i 's/ri\.loadBanner(pm)/ri.activityInfo.loadBanner(pm)/' "$MAIN_ACTIVITY"
          echo "PROJECT_DIR=source/TVRemoteLauncher-v1.9" >> "$GITHUB_ENV"

      - name: Apply native Android TV widget host
        run: python3 patches/apply_widget_host.py "$PROJECT_DIR/app/src/main/java/tw/kangyuan/tvlauncher/MainActivity.java"

      - name: Add widget sizing, ordering and remote controls
        run: python3 patches/enhance_widget_host.py "$PROJECT_DIR/app/src/main/java/tw/kangyuan/tvlauncher/MainActivity.java"

      - name: Verify Widget implementation and Android TV compatibility
        shell: bash
        run: |
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          project = Path(sys.argv[1])
          manifest = (project / "app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          gradle = (project / "app/build.gradle").read_text(encoding="utf-8")
          java = (project / "app/src/main/java/tw/kangyuan/tvlauncher/MainActivity.java").read_text(encoding="utf-8")

          assert re.search(r'<uses-feature android:name="android.software.app_widgets" android:required="false"\s*/>', manifest), "Widget feature must be optional"
          assert r"\n" not in manifest, "Manifest contains a literal escaped newline"
          assert re.search(r'\bminSdk\s+26\b', gradle), "Minimum Android version must remain API 26"
          assert re.search(r'\bversionCode\s+10\b', gradle), "Version Code changed unexpectedly"
          assert "applicationIdSuffix '.debug'" in gradle, "Debug build must remain installable alongside release"
          for token in ("showWidgetPicker", "showWidgetActions", "resizeWidget", "moveWidget", "findFocusedWidgetHost", "updateAppWidgetOptions"):
              assert token in java, f"Missing Widget feature: {token}"
          assert java.count("onActivityResult(int requestCode, int resultCode, Intent data)") == 1, "Duplicate Activity result handler"
          print("Widget implementation and Android TV compatibility checks passed.")
          PY

      - name: Package source for compatibility audit
        uses: actions/upload-artifact@v4
        with:
          name: TVLauncher-v1.9.1-source-audit
          path: source/TVRemoteLauncher-v1.9
          if-no-files-found: error
          retention-days: 7

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLauncher-v1.9.1-debug
          path: source/TVRemoteLauncher-v1.9/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
