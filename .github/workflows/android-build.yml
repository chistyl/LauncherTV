name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TVLauncher-v1.9.1-ready.zip'
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform and Build Tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f TVLauncher-v1.9.1-ready.zip ]; then
            mkdir -p source
            unzip -q TVLauncher-v1.9.1-ready.zip -d source
            echo "PROJECT_DIR=source/TVRemoteLauncher-v1.9" >> "$GITHUB_ENV"
          else
            echo "::error::Android project not found. Add project files or upload TVLauncher-v1.9.1-ready.zip to repository root."
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLauncher-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            source/TVRemoteLauncher-v1.9/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
