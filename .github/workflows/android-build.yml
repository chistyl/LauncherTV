name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.java'
      - '**/*.kt'
      - '**/AndroidManifest.xml'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project structure
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle Wrapper (gradlew) is missing at repository root."
            echo "Extract the Android Studio project so settings.gradle and gradlew are at the repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherTV-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
